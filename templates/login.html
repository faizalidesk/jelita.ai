<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Hoax Detection</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    background:#f0f4ff;
}

/* ===== Layout ===== */

.login-wrapper{
    min-height:100vh;
    display:flex;
}

.left-side{
    flex:1;
    background:linear-gradient(
        135deg,
        #2563eb,
        #4f46e5,
        #7c3aed
    );
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px;
    position:relative;
    overflow:hidden;
}

.left-side::before{
    content:"";
    width:300px;
    height:300px;
    background:rgba(255,255,255,.08);
    border-radius:50%;
    position:absolute;
    top:-100px;
    right:-80px;
}

.left-side::after{
    content:"";
    width:250px;
    height:250px;
    background:rgba(255,255,255,.05);
    border-radius:50%;
    position:absolute;
    bottom:-100px;
    left:-80px;
}

.hero-content{
    text-align:center;
    color:white;
    position:relative;
    z-index:2;
    max-width:600px;
}

.hero-content img{
    width:100%;
    max-width:450px;
    margin-bottom:30px;
}

.hero-title{
    font-size:42px;
    font-weight:800;
    font-family:'Outfit',sans-serif;
}

.hero-subtitle{
    margin-top:12px;
    font-size:16px;
    opacity:.9;
    line-height:1.8;
}

.right-side{
    width:500px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
}

.login-card{
    width:100%;
    max-width:380px;
}

/* ===== Logo ===== */

.brand-logo{
    width:64px;
    height:64px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:28px;
    font-weight:800;
    margin:auto;
}

.login-title{
    text-align:center;
    margin-top:18px;
    font-size:28px;
    font-weight:800;
    color:#1e293b;
}

.login-sub{
    text-align:center;
    color:#64748b;
    margin-bottom:30px;
}

/* ===== Form ===== */

.form-label{
    font-weight:700;
    color:#334155;
}

.form-control{
    border-radius:14px;
    padding:13px 16px;
    border:1.5px solid #e2e8f0;
}

.form-control:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.12);
}

.btn-login{
    width:100%;
    border:none;
    border-radius:14px;
    padding:14px;
    font-weight:700;
    color:white;
    background:linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );
    transition:.3s;
}

.btn-login:hover{
    transform:translateY(-2px);
}

.alert-error{
    background:#fef2f2;
    color:#dc2626;
    border:1px solid #fecaca;
    border-radius:12px;
    padding:12px;
    margin-bottom:20px;
}

.demo-box{
    margin-top:20px;
    background:#eff6ff;
    border:1px solid #bfdbfe;
    border-radius:12px;
    padding:14px;
    font-size:13px;
    color:#1d4ed8;
}

/* ===== Mobile ===== */

@media(max-width:992px){

    .left-side{
        display:none;
    }

    .right-side{
        width:100%;
    }
}

</style>
</head>
<body>

<div class="login-wrapper">

    <!-- KIRI -->
    <div class="left-side">

        <div class="hero-content">

            <!-- GANTI GAMBAR DI SINI -->
            <img src="{{ url_for('static', filename='login-banner.png') }}"
                 alt="Hoax Detection">

            <div class="hero-title">
                Hoax Detection AI
            </div>

            <div class="hero-subtitle">
                Sistem deteksi berita hoaks berbasis Artificial Intelligence
                untuk membantu validasi informasi secara cepat dan akurat.
            </div>

        </div>

    </div>

    <!-- KANAN -->
    <div class="right-side">

        <div class="login-card">

            <div class="brand-logo">
                AI
            </div>

            <div class="login-title">
                Selamat Datang
            </div>

            <div class="login-sub">
                Masuk untuk mengakses sistem
            </div>

            {% if error %}
            <div class="alert-error">
                ❌ {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login">

                <div class="mb-3">
                    <label class="form-label">
                        👤 Username
                    </label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Masukkan username"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        🔒 Password
                    </label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Masukkan password"
                        required>
                </div>

                <button type="submit" class="btn-login">
                    🚀 Masuk
                </button>

            </form>

            <div class="demo-box">
                <strong>Demo Akun</strong><br>
                👤 admin / admin123 <br>
                👤 mahasiswa / hoax2025
            </div>

        </div>

    </div>

</div>

</body>
</html>
